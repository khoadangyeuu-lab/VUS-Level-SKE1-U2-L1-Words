<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look Starter Unit 2 – L1 Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B4F;
  --ink-soft:#5A6788;
  --paper:#F2F7FF;
  --grid:#DFEAFB;
  --card:#FFFFFF;
  --line:#D4E0F3;
  --sun:#FFC93C;
  --sun-deep:#D9A112;
  --grass:#25A96A;
  --grass-deep:#1A7F4F;
  --berry:#E5484D;
  --berry-deep:#B32F34;
  --c-book:#E2342F;
  --c-chair:#4F79A8;
  --c-crayon:#6B55A6;
  --c-desk:#E2702A;
  --c-pencil:#D99A12;
  --c-teacher:#3A8C95;
  --r-lg:28px;
  --r-md:18px;
  --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Nunito",system-ui,sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}

/* ---------- header ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:18px clamp(16px,4vw,40px);
}
.brand{display:flex;align-items:center;gap:14px}
.brand-badge{
  width:52px;height:52px;border-radius:16px;background:var(--sun);
  box-shadow:0 5px 0 var(--sun-deep);display:grid;place-items:center;flex:none;
}
.brand-badge svg{width:30px;height:30px}
.brand small{display:block;font-weight:800;color:var(--ink-soft);font-size:.9rem;letter-spacing:.01em}
.brand h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.1}

.tabs{
  display:flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px;gap:4px;
}
.tab{
  font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;
  padding:10px 20px;border-radius:999px;color:var(--ink-soft);
  display:flex;align-items:center;gap:8px;transition:background .2s,color .2s;
}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab:not([aria-selected="true"]):hover{color:var(--ink);background:var(--paper)}

main{padding:0 clamp(16px,4vw,40px) 32px}
.view[hidden]{display:none}

/* ---------- chunky buttons ---------- */
.btn{
  font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:999px;background:#fff;
  border:2px solid var(--line);box-shadow:0 4px 0 var(--line);
  transition:transform .08s, box-shadow .08s, background .2s;
}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.is-on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 0 #0E1630}
.btn-primary{
  background:var(--sun);border-color:var(--sun-deep);box-shadow:0 5px 0 var(--sun-deep);
  font-size:1.2rem;padding:14px 28px;
}
.btn-primary:active{box-shadow:0 2px 0 var(--sun-deep)}
.btn-icon{padding:11px;border-radius:50%}

/* ---------- flashcards ---------- */
.toolbar{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin:4px auto 22px;
}
.toolbar .hint{color:var(--ink-soft);font-weight:700;margin-left:8px}
.deck{
  --w:min(1040px, max(600px, calc((100dvh - 250px) * 1.875 + 40px)));
  width:min(100%,var(--w));margin:0 auto;
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
}
.fc{perspective:1200px;aspect-ratio:5/4}
.fc-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1);
}
.fc.is-word .fc-inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:var(--r-lg);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:grid;place-items:center;overflow:hidden;
}
.face-pic{
  background:var(--card);border:3px solid color-mix(in srgb,var(--c) 30%,white);
  box-shadow:0 7px 0 color-mix(in srgb,var(--c) 30%,white);
}
.face-pic img{width:78%;height:88%;object-fit:contain;pointer-events:none;user-select:none}
.face-word{
  transform:rotateY(180deg);background:var(--c);
  box-shadow:0 7px 0 color-mix(in srgb,var(--c) 70%,black);
  color:#fff;
}
.face-word{container-type:inline-size}
.face-word span{
  font-family:"Fredoka",sans-serif;font-weight:700;
  font-size:min(17cqw,4.6rem);letter-spacing:.01em;
  text-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black);
}
.speak{
  position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;
}
.speak:hover{background:rgba(255,255,255,.36)}
.speak svg{width:22px;height:22px}
.fc button.flip{position:absolute;inset:0;border-radius:var(--r-lg);z-index:1}
.fc.is-word button.flip{z-index:0}
.fc.is-word .speak{z-index:2}

/* ---------- game ---------- */
.game{width:min(100%,980px);margin:0 auto}
.gbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  margin-bottom:16px;
}
.round-label{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.25rem;display:flex;align-items:center;gap:12px}
.chip{
  font-family:"Nunito",sans-serif;font-weight:800;font-size:.9rem;
  padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);
  display:inline-flex;align-items:center;gap:6px;
}
.chip svg{width:16px;height:16px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:all .25s}
.dot.word{border-radius:4px}
.dot.cur{border-color:var(--ink);transform:scale(1.25)}
.dot.ok{background:var(--grass);border-color:var(--grass)}
.dot.no{background:var(--berry);border-color:var(--berry)}
.score{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.score svg{width:26px;height:26px}
.score.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}

.stage-wrap{position:relative}
.stage{
  --w:min(980px, max(420px, calc((100dvh - 450px) * 1.5 + 32px)));
  width:min(100%,var(--w));margin:0 auto;
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
}
.tile{
  aspect-ratio:1/1;border-radius:22px;display:grid;place-items:center;position:relative;
  background:#fff;border:3px solid color-mix(in srgb,var(--c) 30%,white);
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 30%,white);
}
.tile img{width:80%;height:80%;object-fit:contain}
.tile.word{background:var(--c);border-color:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 70%,black);color:#fff}
.tile.word{container-type:inline-size}
.tile.word span{font-family:"Fredoka",sans-serif;font-weight:700;font-size:min(21cqw,3rem);text-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black)}
.tile.missing{
  background:repeating-linear-gradient(-45deg,#fff 0 14px,var(--paper) 14px 28px);
  border:3px dashed var(--ink-soft);box-shadow:none;color:var(--ink);
}
.tile.missing b{
  font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(3rem,8vw,6rem);line-height:1;
  animation:bob 1.6s ease-in-out infinite;color:var(--ink);
}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.tile.reveal{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tile.reveal::after{
  content:"";position:absolute;inset:-9px;border-radius:28px;border:4px solid var(--grass);
}
.tile.reveal.wrong::after{border-color:var(--berry)}
.stage.dealing .tile{animation:deal .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes deal{from{opacity:0;transform:translateY(18px) scale(.9)}}

.curtain{
  position:absolute;inset:-12px;border-radius:30px;background:var(--ink);color:#fff;
  display:grid;place-items:center;text-align:center;z-index:5;
  transform:scaleY(0);transform-origin:top;transition:transform .45s cubic-bezier(.6,0,.3,1);
}
.curtain.down{transform:scaleY(1)}
.curtain-inner{opacity:0;transition:opacity .2s}
.curtain.down .curtain-inner{opacity:1;transition-delay:.3s}
.curtain svg{width:120px;height:60px;margin-bottom:10px}
.curtain p{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.8rem,4vw,3rem)}
.curtain .count{font-family:"Fredoka",sans-serif;font-size:1.4rem;opacity:.75;margin-top:6px}

.panel{margin-top:26px;text-align:center;min-height:170px}
.question{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.5rem,3vw,2rem);margin-bottom:14px}
.look-copy{color:var(--ink-soft);font-weight:700;font-size:1.1rem;margin-bottom:16px}
.options{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.opt{
  background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);
  border-radius:20px;position:relative;
  transition:transform .08s, box-shadow .08s, border-color .2s;
}
.opt:hover{border-color:var(--ink-soft)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.pic{width:clamp(96px,14vw,128px);aspect-ratio:1/1;display:grid;place-items:center}
.opt.pic img{width:82%;height:82%;object-fit:contain}
.opt.txt{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.4rem,3vw,2rem);padding:16px 34px;min-width:150px}
.opt .key{
  position:absolute;top:-10px;left:-10px;width:28px;height:28px;border-radius:50%;
  background:var(--ink);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center;
}
.opt.ok{border-color:var(--grass);box-shadow:0 6px 0 var(--grass-deep);background:#E6F7EE}
.opt.no{border-color:var(--berry);box-shadow:0 6px 0 var(--berry-deep);background:#FDECEC;animation:shake .4s}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.ok):not(.no){opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.feedback{
  font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.35rem;margin:18px 0 12px;min-height:1.7em;
  display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
}
.feedback .btn{color:var(--ink)}
.feedback.good{color:var(--grass-deep)}
.feedback.bad{color:var(--berry-deep)}

/* end screen */
.result{
  width:min(100%,560px);margin:30px auto 0;background:#fff;border-radius:32px;border:3px solid var(--line);
  box-shadow:0 8px 0 var(--line);padding:40px 28px;text-align:center;
}
.stars{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.stars svg{width:62px;height:62px}
.stars svg:nth-child(2){transform:translateY(-14px);width:76px;height:76px}
.stars .on{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars .on:nth-child(2){animation-delay:.15s}
.stars .on:nth-child(3){animation-delay:.3s}
.result h2{font-family:"Fredoka",sans-serif;font-weight:700;font-size:2.4rem}
.result p{font-size:1.2rem;font-weight:700;color:var(--ink-soft);margin:6px 0 26px}
.result .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.sound-toggle{position:fixed;right:18px;bottom:18px;z-index:10;background:#fff}

@media (max-width:640px){
  .deck{grid-template-columns:repeat(2,1fr);gap:14px}
  .tab span{display:none}
  .tab{padding:10px 16px}
  .stage{gap:10px}
  .tile{border-radius:16px}
  .opt.txt{padding:12px 22px;min-width:110px}
  .top{padding-top:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<header class="top">
  <div class="brand">
    <div class="brand-badge" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="#1E2B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5c4-1.6 7.5-1.2 11 1.2 3.5-2.4 7-2.8 11-1.2v17c-4-1.6-7.5-1.2-11 1.2-3.5-2.4-7-2.8-11-1.2z"/><path d="M16 8.7v17"/></svg>
    </div>
    <div>
      <small>Look Starter</small>
      <h1>Unit 2 – L1 Words</h1>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-flash" aria-selected="true" aria-controls="view-flash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="14" rx="3"/><path d="M8 3h10a3 3 0 0 1 3 3v11"/></svg>
      <span>Flashcards</span>
    </button>
    <button class="tab" role="tab" id="tab-game" aria-selected="false" aria-controls="view-game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.5"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
      <span>What's missing?</span>
    </button>
  </nav>
</header>

<main>
  <!-- FLASHCARDS -->
  <section class="view" id="view-flash" role="tabpanel" aria-labelledby="tab-flash">
    <div class="toolbar">
      <button class="btn is-on" id="all-pics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
        Show all pictures
      </button>
      <button class="btn" id="all-words">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 9 5l5 14M5.8 14h6.4"/><path d="M15 12.5c.6-1 1.6-1.5 2.8-1.5 1.8 0 3.2 1 3.2 3v5m0-3.4c-.6-.4-1.6-.6-2.6-.6-1.6 0-3 .7-3 2.1 0 1.2 1 1.9 2.3 1.9 1.6 0 3.3-1 3.3-3.4"/></svg>
        Show all words
      </button>
      <button class="btn" id="shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Shuffle
      </button>
      <span class="hint">Tap a card to flip it</span>
    </div>
    <div class="deck" id="deck"></div>
  </section>

  <!-- WHAT'S MISSING -->
  <section class="view" id="view-game" role="tabpanel" aria-labelledby="tab-game" hidden>
    <div class="game" id="game"></div>
  </section>
</main>

<button class="btn btn-icon sound-toggle" id="sound" aria-label="Sound on" title="Sound on/off"></button>

  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  replay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  star:(on)=>`<svg viewBox="0 0 24 24" class="${on?'on':''}"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z" fill="${on?'#FFC93C':'#E3EBF7'}" stroke="${on?'#D9A112':'#CAD7EC'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  closedEyes:'<svg viewBox="0 0 120 60" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"><path d="M10 26c8 12 30 12 38 0M72 26c8 12 30 12 38 0"/><path d="M17 36l-5 8M29 39v9M41 36l5 8M79 36l-5 8M91 39v9M103 36l5 8"/></svg>'
};

/* ---------------- sound ---------------- */
let soundOn = true, actx = null;
function tone(freqs, dur=.12, type="sine", vol=.18){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.85;
    });
  }catch(e){}
}
const sfx = {
  flip:()=>tone([660],.08,"triangle",.12),
  good:()=>tone([523,659,784,1047],.13,"triangle",.2),
  bad:()=>tone([300,220],.18,"sawtooth",.08),
  whoosh:()=>tone([440,330,262],.1,"sine",.12)
};
function say(word){
  if(!soundOn || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/^en(-|_)(US|GB)/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function paintSound(){
  const b=$("#sound");b.innerHTML=soundOn?ICON.speaker:ICON.mute;
  b.setAttribute("aria-label",soundOn?"Sound on":"Sound off");
}
$("#sound").onclick=()=>{soundOn=!soundOn;paintSound();if(!soundOn&&"speechSynthesis" in window)speechSynthesis.cancel();};
paintSound();

/* ---------------- tabs ---------------- */
function showTab(name){
  const flash = name==="flash";
  $("#tab-flash").setAttribute("aria-selected",flash);
  $("#tab-game").setAttribute("aria-selected",!flash);
  $("#view-flash").hidden=!flash;
  $("#view-game").hidden=flash;
  if(!flash && !game.started) newGame();
}
$("#tab-flash").onclick=()=>showTab("flash");
$("#tab-game").onclick=()=>showTab("game");

/* ---------------- flashcards ---------------- */
let deckOrder = WORDS.slice();
const flipped = new Set();
function renderDeck(){
  $("#deck").innerHTML = deckOrder.map(w=>`
    <div class="fc ${flipped.has(w)?'is-word':''}" data-w="${w}" style="--c:${color(w)}">
      <div class="fc-inner">
        <div class="face face-pic"><img src="${IMGS[w]}" alt="${w}"></div>
        <div class="face face-word"><span>${esc(w)}</span>
          <button class="speak" aria-label="Say ${w}" data-say="${w}">${ICON.speaker}</button>
        </div>
      </div>
      <button class="flip" aria-label="Flip the ${w} card"></button>
    </div>`).join("");
  syncAllButtons();
}
function syncAllButtons(){
  $("#all-pics").classList.toggle("is-on", flipped.size===0);
  $("#all-words").classList.toggle("is-on", flipped.size===WORDS.length);
}
$("#deck").addEventListener("click",e=>{
  const sp=e.target.closest("[data-say]");
  if(sp){ e.stopPropagation(); say(sp.dataset.say); return; }
  const card=e.target.closest(".fc"); if(!card) return;
  const w=card.dataset.w;
  if(flipped.has(w)) flipped.delete(w); else { flipped.add(w); say(w); }
  card.classList.toggle("is-word",flipped.has(w));
  sfx.flip(); syncAllButtons();
});
function setAll(words){
  flipped.clear(); if(words) WORDS.forEach(w=>flipped.add(w));
  document.querySelectorAll(".fc").forEach((c,i)=>{
    setTimeout(()=>c.classList.toggle("is-word",words),i*70);
  });
  sfx.flip(); syncAllButtons();
}
$("#all-pics").onclick=()=>setAll(false);
$("#all-words").onclick=()=>setAll(true);
$("#shuffle").onclick=()=>{
  let n; do{ n=shuffle(WORDS); }while(n.join()===deckOrder.join());
  deckOrder=n; renderDeck(); sfx.whoosh();
  document.querySelectorAll(".fc").forEach((c,i)=>{c.animate([{opacity:0,transform:"translateY(14px) scale(.94)"},{opacity:1,transform:"none"}],{duration:380,delay:i*55,easing:"cubic-bezier(.3,1.4,.5,1)",fill:"backwards"});});
};
renderDeck();

/* ---------------- What's missing? ---------------- */
const game = { started:false };

// Missing items: no repeat within GAP rounds, and spread evenly.
function buildMissingSeq(){
  const seq=[], used={}; WORDS.forEach(w=>used[w]=0);
  for(let r=0;r<ROUNDS;r++){
    const recent=seq.slice(-GAP);
    let pool=WORDS.filter(w=>!recent.includes(w));
    const min=Math.min(...pool.map(w=>used[w]));
    pool=pool.filter(w=>used[w]===min);
    const pick=pool[Math.random()*pool.length|0];
    seq.push(pick); used[pick]++;
  }
  return seq;
}

// Grid slot (0–5, 3 columns × 2 rows) where the "?" appears each round.
// Never the same slot within the last 3 rounds, never a direct neighbour of
// last round's slot when avoidable, and every slot used about equally.
const POS_GAP = 3;
const slotRC = i => [Math.floor(i/3), i%3];
const isNeighbour = (a,b) => { const [r1,c1]=slotRC(a),[r2,c2]=slotRC(b); return Math.abs(r1-r2)+Math.abs(c1-c2)===1; };
function buildPosSeq(){
  const seq=[], used=[0,0,0,0,0,0];
  for(let r=0;r<ROUNDS;r++){
    const recent=seq.slice(-POS_GAP), prev=seq[seq.length-1];
    let pool=[0,1,2,3,4,5].filter(p=>!recent.includes(p));
    const far=pool.filter(p=>prev===undefined||!isNeighbour(p,prev));
    if(far.length) pool=far;
    const min=Math.min(...pool.map(p=>used[p]));
    pool=pool.filter(p=>used[p]===min);
    const pick=pool[Math.random()*pool.length|0];
    seq.push(pick); used[pick]++;
  }
  return seq;
}

function newGame(){
  Object.assign(game,{
    started:true, round:0, score:0, results:[],
    seq:buildMissingSeq(), posSeq:buildPosSeq(), lastDistractors:[]
  });
  startRound();
}
const modeOf = r => r%2===0 ? "pic" : "word";

function shell(){
  const r=game.round, mode=modeOf(r);
  const dots=Array.from({length:ROUNDS},(_,i)=>{
    const cls=[ "dot", modeOf(i)==="word"?"word":"", i===r&&game.phase!=="done"?"cur":"", game.results[i]===true?"ok":game.results[i]===false?"no":"" ].join(" ");
    return `<span class="${cls}"></span>`;
  }).join("");
  return `
    <div class="gbar">
      <div class="round-label">Round ${r+1} of ${ROUNDS}
        <span class="chip">${mode==="pic"?ICON.pic+"Pictures":ICON.word+"Words"}</span>
      </div>
      <div class="dots" aria-label="Progress">${dots}</div>
      <div class="score" id="score" aria-label="Score">${ICON.star(true)}<span>${game.score}</span></div>
    </div>
    <div class="stage-wrap">
      <div class="stage" id="stage"></div>
      <div class="curtain" id="curtain"><div class="curtain-inner">${ICON.closedEyes}<p>Close your eyes!</p><div class="count" id="count"></div></div></div>
    </div>
    <div class="panel" id="panel"></div>`;
}

function tileHTML(w, mode){
  if(w===null) return `<div class="tile missing" id="hole"><b>?</b></div>`;
  return mode==="pic"
    ? `<div class="tile" style="--c:${color(w)}"><img src="${IMGS[w]}" alt="${w}"></div>`
    : `<div class="tile word" style="--c:${color(w)}"><span>${esc(w)}</span></div>`;
}
function renderStage(order, mode, missing){
  const st=$("#stage");
  st.innerHTML=order.map(w=>tileHTML(w===missing?null:w,mode)).join("");
  st.classList.remove("dealing"); void st.offsetWidth; st.classList.add("dealing");
  st.querySelectorAll(".tile").forEach((t,i)=>t.style.animationDelay=(i*60)+"ms");
}

function startRound(){
  game.phase="look";
  game.order=shuffle(WORDS);
  const mode=modeOf(game.round);
  $("#game").innerHTML=shell();
  renderStage(game.order,mode,null);
  $("#panel").innerHTML=`
    <p class="look-copy">Look at the ${mode==="pic"?"pictures":"words"} carefully. Say them out loud!</p>
    <button class="btn btn-primary" id="hide">${ICON.eye} Hide one!</button>`;
  $("#hide").onclick=hideOne;
}

function hideOne(){
  if(game.phase!=="look") return;
  game.phase="hiding";
  const mode=modeOf(game.round), missing=game.seq[game.round];
  const cur=$("#curtain"), cnt=$("#count");
  $("#panel").innerHTML="";
  cur.classList.add("down"); sfx.whoosh();
  let n=3; cnt.textContent=n;
  const tick=setInterval(()=>{
    n--; if(n>0){ cnt.textContent=n; tone([520],.06,"triangle",.1); return; }
    clearInterval(tick);
    // shuffle the other five, then drop the hidden word into this round's slot
    const slot=game.posSeq[game.round];
    let o; do{
      o=shuffle(WORDS.filter(w=>w!==missing));
      o.splice(slot,0,missing);
    }while(o.join()===game.order.join());
    game.order=o; game.missing=missing;
    renderStage(o,mode,missing);
    cur.classList.remove("down");
    setTimeout(()=>showOptions(mode,missing),250);
  },650);
}

function pickDistractors(missing){
  const others=WORDS.filter(w=>w!==missing);
  // prefer words that weren't distractors last round
  const fresh=shuffle(others.filter(w=>!game.lastDistractors.includes(w)));
  const rest=shuffle(others.filter(w=>game.lastDistractors.includes(w)));
  const d=fresh.concat(rest).slice(0,2);
  game.lastDistractors=d;
  return d;
}

function showOptions(mode,missing){
  game.phase="guess";
  const opts=shuffle([missing,...pickDistractors(missing)]);
  game.opts=opts;
  $("#panel").innerHTML=`
    <h2 class="question">What's missing?</h2>
    <div class="options" id="opts">
      ${opts.map((w,i)=> mode==="pic"
        ? `<button class="opt pic" data-w="${w}" aria-label="${w}"><span class="key">${i+1}</span><img src="${IMGS[w]}" alt=""></button>`
        : `<button class="opt txt" data-w="${w}"><span class="key">${i+1}</span>${esc(w)}</button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>`;
  $("#opts").onclick=e=>{const b=e.target.closest(".opt"); if(b) answer(b.dataset.w);};
}

function answer(w){
  if(game.phase!=="guess") return;
  game.phase="answered";
  const mode=modeOf(game.round), missing=game.missing, right=w===missing;
  game.results[game.round]=right;
  if(right){ game.score++; sfx.good(); } else sfx.bad();
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.dataset.w===missing) b.classList.add("ok");
    else if(b.dataset.w===w) b.classList.add("no");
  });
  // reveal the hidden item
  const hole=$("#hole");
  const tmp=document.createElement("div"); tmp.innerHTML=tileHTML(missing,mode);
  const t=tmp.firstElementChild; t.classList.add("reveal"); if(!right) t.classList.add("wrong");
  hole.replaceWith(t);
  setTimeout(()=>say(missing), right?450:550);
  // update bar
  const sc=$("#score"); sc.querySelector("span").textContent=game.score;
  if(right){ sc.classList.remove("bump"); void sc.offsetWidth; sc.classList.add("bump"); }
  const dot=document.querySelectorAll(".dot")[game.round]; dot.classList.add(right?"ok":"no");
  const last=game.round===ROUNDS-1;
  $("#fb").className="feedback "+(right?"good":"bad");
  $("#fb").innerHTML=`<span>${right?"Great job! It's the "+missing+".":"Oops! It's the "+missing+"."}</span>
    <button class="btn btn-primary" id="next">${last?"See results":"Next round"} ${ICON.next}</button>`;
  $("#next").onclick=nextRound;
  $("#next").focus({preventScroll:true});
}

function nextRound(){
  if(game.round===ROUNDS-1) return finish();
  game.round++; startRound();
}

function finish(){
  game.phase="done";
  const s=game.score, stars = s>=9?3 : s>=6?2 : s>=3?1 : 0;
  const msg = s===ROUNDS?"Perfect memory!" : s>=8?"Super!" : s>=5?"Good work!" : "Nice try!";
  $("#game").innerHTML=`
    <div class="result">
      <div class="stars">${[0,1,2].map(i=>ICON.star(i<stars)).join("")}</div>
      <h2>${msg}</h2>
      <p>You got ${s} out of ${ROUNDS}.</p>
      <div class="row">
        <button class="btn btn-primary" id="again">${ICON.replay} Play again</button>
        <button class="btn" id="toflash">Back to flashcards</button>
      </div>
    </div>`;
  if(stars) setTimeout(sfx.good,200);
  $("#again").onclick=newGame;
  $("#toflash").onclick=()=>showTab("flash");
}

/* keyboard: 1-3 to answer, Enter/Space for main button */
document.addEventListener("keydown",e=>{
  if($("#view-game").hidden) return;
  if(game.phase==="guess" && ["1","2","3"].includes(e.key)){ answer(game.opts[+e.key-1]); }
});
</script>
</body>
</html>
